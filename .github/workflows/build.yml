name: Compilar Rinnegan Six Paths

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Verificar dependência do Narutoto
        shell: bash
        run: |
          if [ ! -f "libs/narutoto-0_4_1-forge.jar" ]; then
            echo "ERRO: coloque o arquivo narutoto-0_4_1-forge.jar dentro da pasta libs/ e envie-o ao repositório."
            exit 1
          fi

      - name: Compilar addon
        run: gradle --no-daemon build

      - name: Publicar JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: rinnegan-six-paths-jar
          path: build/libs/*.jar
          if-no-files-found: error
